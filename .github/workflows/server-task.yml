name: Server task (qo'lda)

# Serverdagi bir martalik buyruqlarni GitHub sahifasidan bajaradi — SSH paroli kerak emas,
# deploy'da ishlatiladigan SSH_KEY secret'i bilan kiradi.
# Ishga tushirish: Actions → "Server task (qo'lda)" → Run workflow → vazifani tanlang.
#
# Maxfiy qiymatlar Secrets'dan olinadi (Settings → Secrets and variables → Actions):
#   OWNER_PASSWORD  — set-owner uchun yangi admin paroli (majburiy, faqat shu vazifada)
#   OWNER_PHONE     — ixtiyoriy, default +998990000000
#   STAFF_PASSWORD  — ixtiyoriy, yangi xodimlar paroli. Berilmasa har bir xodimga
#                     tasodifiy kuchli parol beriladi (ro'yxat vazifa logida chiqadi)
#   ADMIN_PHONE     — admin-create uchun Administrator logini (+998...)
#   ADMIN_PASSWORD  — admin-create uchun parol (logga chiqmaydi)
#   ADMIN_NAME      — ixtiyoriy, Administrator ismi
#   ADMIN_OVERWRITE — "1" bo'lsa, ADMIN_PHONE band bo'lsa ham o'sha hisob almashtiriladi
#   COORDINATOR_PASSWORD — ixtiyoriy, hisobi yo'q koordinatorga ochiladigan parol
#   COORDINATORS_JSON — koordinator–sinf ro'yxati, masalan:
#                     [{"name":"Ism Familiya","phone":"+998901234567","classes":["6-Ahmad Al-Farg'oniy"]}]

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Vazifa"
        required: true
        type: choice
        default: staff-seed-dry
        options:
          - staff-seed-dry      # xodimlar ro'yxatini ko'rish (baza o'zgarmaydi)
          - staff-seed          # xodimlarni qo'shish
          - staff-password      # ro'yxatdagi hamma xodim parolini yangilash (default 123456)
          - set-owner           # admin parolini yangilash (OWNER_PASSWORD secret)
          - admin-create        # Administrator hisobi (ADMIN_PHONE + ADMIN_PASSWORD)
          - make-owner          # OWNER_PHONE egasiga "owner" roli (hamma oyna)
          - coordinators-dry    # koordinator–sinf biriktiruvini ko'rish
          - coordinators        # koordinatorlarga sinflarni biriktirish
          - students-inactive-dry # shartnomasi bekor bo'lganlarni ko'rish
          - students-inactive   # ularni "Nofaol" qilish
          - roles-apply         # rol ruxsatlarini qayta qo'llash
          - all-superadmin-dry  # kim superadmin bo'lishini ko'rish
          - all-superadmin      # hammani superadmin qilish
          - users               # bazadagi foydalanuvchilar ro'yxati
          - teachers            # ustozlarga biriktirilgan fan va sinflar
          - employees-sync-dry  # kimga xodim kartasi ochilishini ko'rish
          - employees-sync      # foydalanuvchilarga xodim kartasi ochish
          - diag                # server holati: git, node, fayllar, pm2
          - logs                # backend loglari (xatolikni ko'rish uchun)

concurrency:
  group: server-task
  cancel-in-progress: false

jobs:
  run:
    name: ${{ inputs.task }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Serverda bajarish (SSH)
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          OWNER_PHONE: ${{ secrets.OWNER_PHONE }}
          OWNER_PASSWORD: ${{ secrets.OWNER_PASSWORD }}
          STAFF_PASSWORD: ${{ secrets.STAFF_PASSWORD }}
          ADMIN_PHONE: ${{ secrets.ADMIN_PHONE }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          ADMIN_NAME: ${{ secrets.ADMIN_NAME }}
          ADMIN_OVERWRITE: ${{ secrets.ADMIN_OVERWRITE }}
          COORDINATORS_JSON: ${{ secrets.COORDINATORS_JSON }}
          COORDINATOR_PASSWORD: ${{ secrets.COORDINATOR_PASSWORD }}
          TASK: ${{ inputs.task }}
        run: |
          set -e
          if [ -z "$SSH_HOST" ]; then
            echo "::error::SSH_HOST secret yo'q — serverga ulanib bo'lmaydi."
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          PORT="${SSH_PORT:-22}"
          ssh-keyscan -p "$PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          # Qiymatlar ichida apostrof/qo'shtirnoq bo'lsa ham buzilmasin (COORDINATORS_JSON) —
          # env fayl base64 qilib yuboriladi, logga chiqmaydi.
          ENV_FILE="$(mktemp)"
          for v in TASK OWNER_PHONE OWNER_PASSWORD STAFF_PASSWORD ADMIN_PHONE ADMIN_PASSWORD ADMIN_NAME ADMIN_OVERWRITE COORDINATORS_JSON COORDINATOR_PASSWORD; do
            printf 'export %s=%q\n' "$v" "${!v:-}" >> "$ENV_FILE"
          done
          ENV_B64="$(base64 -w0 < "$ENV_FILE")"
          rm -f "$ENV_FILE"
          ssh -i ~/.ssh/id_ed25519 -p "$PORT" -o StrictHostKeyChecking=no "$SSH_USER@$SSH_HOST" \
            "TASK_ENV_B64='$ENV_B64' bash -s" \
            < deploy/server-task.sh
